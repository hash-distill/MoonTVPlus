name: Check Cloudflare build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_STORAGE_TYPE: d1
      BUILD_TARGET: cloudflare
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:cloudflare
      - name: Validate Worker bundle without publishing
        run: |
          sed -i 's/REPLACE_WITH_YOUR_D1_DATABASE_ID/00000000-0000-4000-8000-000000000000/' wrangler.toml
          pnpm dlx wrangler@4.60.0 deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"
